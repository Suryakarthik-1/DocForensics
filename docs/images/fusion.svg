<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Segoe UI, Inter, sans-serif">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141b"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="980" height="470" rx="16" fill="url(#fbg)"/>
  <text x="32" y="44" fill="#f3f5fa" font-size="22" font-weight="700">Signal Fusion &amp; Verdict</text>
  <text x="32" y="68" fill="#7b8294" font-size="14">A weighted blend, plus a strong-signal boost so one confident detector isn't drowned out</text>

  <!-- weights bars -->
  <text x="32" y="104" fill="#9aa0b4" font-size="12" font-weight="600" letter-spacing="1">FUSION WEIGHTS</text>
  <g font-size="12">
    <!-- name, bar(width = weight*600), pct -->
    <text x="32" y="134" fill="#cdd2de">🧠 TamperNet (CNN)</text>
    <rect x="210" y="123" width="540" height="14" rx="7" fill="#171b24"/><rect x="210" y="123" width="180" height="14" rx="7" fill="#6366f1"/>
    <text x="760" y="134" fill="#c7c9ff">0.30</text>

    <text x="32" y="160" fill="#cdd2de">🤖 AI-Generated</text>
    <rect x="210" y="149" width="540" height="14" rx="7" fill="#171b24"/><rect x="210" y="149" width="120" height="14" rx="7" fill="#6366f1"/>
    <text x="760" y="160" fill="#cdd2de">0.20</text>

    <text x="32" y="186" fill="#cdd2de">🔬 ELA</text>
    <rect x="210" y="175" width="540" height="14" rx="7" fill="#171b24"/><rect x="210" y="175" width="90" height="14" rx="7" fill="#8b8ff5"/>
    <text x="760" y="186" fill="#cdd2de">0.15</text>

    <text x="32" y="212" fill="#cdd2de">📡 Noise</text>
    <rect x="210" y="201" width="540" height="14" rx="7" fill="#171b24"/><rect x="210" y="201" width="78" height="14" rx="7" fill="#8b8ff5"/>
    <text x="760" y="212" fill="#cdd2de">0.13</text>

    <text x="32" y="238" fill="#cdd2de">🔤 Font</text>
    <rect x="210" y="227" width="540" height="14" rx="7" fill="#171b24"/><rect x="210" y="227" width="60" height="14" rx="7" fill="#a5a8f7"/>
    <text x="760" y="238" fill="#cdd2de">0.10</text>

    <text x="32" y="264" fill="#cdd2de">🏷️ Metadata</text>
    <rect x="210" y="253" width="540" height="14" rx="7" fill="#171b24"/><rect x="210" y="253" width="30" height="14" rx="7" fill="#c0c2fa"/>
    <text x="760" y="264" fill="#cdd2de">0.05</text>

    <text x="32" y="290" fill="#9aa0b4">🧬 Copy-Move · 🗜️ Double-JPEG</text>
    <rect x="210" y="279" width="540" height="14" rx="7" fill="#171b24"/><rect x="210" y="279" width="24" height="14" rx="7" fill="#5b6270"/>
    <text x="760" y="290" fill="#7b8294">0.04 / 0.03</text>
  </g>
  <text x="32" y="316" fill="#7b8294" font-size="11">Copy-move &amp; double-JPEG are weak on repetitive text documents → kept as low-weight hints.</text>

  <!-- formula / verdict -->
  <rect x="32" y="340" width="916" height="104" rx="12" fill="#10131a" stroke="#2e3148"/>
  <text x="52" y="370" fill="#9aa0b4" font-size="12" font-weight="600" letter-spacing="1">DECISION</text>

  <text x="52" y="398" fill="#cdd2de" font-size="13">score = max( Σ wᵢ·sᵢ ,  0.55·strongest + 0.45·Σ wᵢ·sᵢ )</text>
  <text x="52" y="420" fill="#7b8294" font-size="12">strongest = max(CNN, AI, ELA) — keeps a lone confident detector from being diluted to zero</text>

  <rect x="624" y="356" width="104" height="30" rx="15" fill="rgba(34,197,94,.15)" stroke="#22c55e"/>
  <text x="676" y="376" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">AUTHENTIC</text>
  <rect x="736" y="356" width="96" height="30" rx="15" fill="rgba(239,68,68,.15)" stroke="#ef4444"/>
  <text x="784" y="376" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">TAMPERED</text>
  <rect x="624" y="394" width="208" height="30" rx="15" fill="rgba(245,158,11,.15)" stroke="#f59e0b"/>
  <text x="728" y="414" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">AI-GENERATED</text>
  <text x="852" y="376" fill="#7b8294" font-size="11">threshold</text>
  <text x="852" y="392" fill="#cdd2de" font-size="13" font-weight="700">0.45</text>
</svg>
