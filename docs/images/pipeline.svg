<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="Segoe UI, Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141b"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <marker id="ar-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="440" rx="16" fill="url(#bg)"/>
  <text x="32" y="44" fill="#f3f5fa" font-size="22" font-weight="700">Analysis Pipeline</text>
  <text x="32" y="68" fill="#7b8294" font-size="14">Upload → preprocess → 7 detectors + CNN → fusion → verdict</text>

  <!-- Stage 1: Upload -->
  <g>
    <rect x="32" y="110" width="150" height="86" rx="12" fill="#151922" stroke="#262c39"/>
    <text x="107" y="146" text-anchor="middle" font-size="26">📄</text>
    <text x="107" y="176" text-anchor="middle" fill="#d4d8e2" font-size="13" font-weight="600">Upload</text>
    <text x="107" y="192" text-anchor="middle" fill="#7b8294" font-size="11">image / PDF</text>
  </g>
  <line x1="182" y1="153" x2="214" y2="153" stroke="#6366f1" stroke-width="2" marker-end="url(#ar-p)"/>

  <!-- Stage 2: Preprocess -->
  <g>
    <rect x="216" y="110" width="160" height="86" rx="12" fill="#151922" stroke="#262c39"/>
    <text x="296" y="146" text-anchor="middle" font-size="24">⚙️</text>
    <text x="296" y="176" text-anchor="middle" fill="#d4d8e2" font-size="13" font-weight="600">Preprocess</text>
    <text x="296" y="192" text-anchor="middle" fill="#7b8294" font-size="11">resize · deskew · OCR</text>
  </g>
  <line x1="376" y1="153" x2="408" y2="153" stroke="#6366f1" stroke-width="2" marker-end="url(#ar-p)"/>

  <!-- Stage 3: Detectors group -->
  <g>
    <rect x="410" y="86" width="316" height="268" rx="14" fill="#10131a" stroke="#2e3148"/>
    <text x="568" y="112" text-anchor="middle" fill="#9aa0b4" font-size="12" font-weight="600" letter-spacing="1">DETECTORS</text>

    <!-- detector chips -->
    <g font-size="11.5" fill="#cdd2de">
      <rect x="426" y="126" width="138" height="30" rx="8" fill="#171b24" stroke="#262c39"/><text x="436" y="145">🔬 ELA</text>
      <rect x="572" y="126" width="138" height="30" rx="8" fill="#171b24" stroke="#262c39"/><text x="582" y="145">📡 Noise</text>
      <rect x="426" y="162" width="138" height="30" rx="8" fill="#171b24" stroke="#262c39"/><text x="436" y="181">🧬 Copy-Move</text>
      <rect x="572" y="162" width="138" height="30" rx="8" fill="#171b24" stroke="#262c39"/><text x="582" y="181">🗜️ Double-JPEG</text>
      <rect x="426" y="198" width="138" height="30" rx="8" fill="#171b24" stroke="#262c39"/><text x="436" y="217">🔤 Font</text>
      <rect x="572" y="198" width="138" height="30" rx="8" fill="#171b24" stroke="#262c39"/><text x="582" y="217">🏷️ Metadata</text>
      <rect x="426" y="234" width="138" height="30" rx="8" fill="#171b24" stroke="#262c39"/><text x="436" y="253">🤖 AI-Generated</text>
      <rect x="572" y="234" width="138" height="30" rx="8" fill="#1c1f3a" stroke="#6366f1"/><text x="582" y="253" fill="#c7c9ff">🧠 TamperNet</text>
    </g>
    <text x="568" y="296" text-anchor="middle" fill="#7b8294" font-size="11">each emits a score (0–1) + heatmap</text>
    <text x="568" y="332" text-anchor="middle" fill="#6366f1" font-size="11" font-weight="600">TamperNet CNN is the primary signal</text>
  </g>
  <line x1="726" y1="220" x2="758" y2="220" stroke="#6366f1" stroke-width="2" marker-end="url(#ar-p)"/>

  <!-- Stage 4: Fusion -->
  <g>
    <rect x="760" y="176" width="120" height="88" rx="12" fill="#151922" stroke="#262c39"/>
    <text x="820" y="214" text-anchor="middle" font-size="24">⚖️</text>
    <text x="820" y="244" text-anchor="middle" fill="#d4d8e2" font-size="13" font-weight="600">Fusion</text>
    <text x="820" y="260" text-anchor="middle" fill="#7b8294" font-size="10.5">weighted + boost</text>
  </g>
  <line x1="820" y1="264" x2="820" y2="300" stroke="#6366f1" stroke-width="2" marker-end="url(#ar-p)"/>

  <!-- Stage 5: Verdict -->
  <g>
    <rect x="700" y="306" width="248" height="104" rx="12" fill="#151922" stroke="#262c39"/>
    <text x="824" y="332" text-anchor="middle" fill="#9aa0b4" font-size="11" font-weight="600" letter-spacing="1">VERDICT</text>
    <rect x="716" y="344" width="100" height="26" rx="13" fill="rgba(34,197,94,.15)" stroke="#22c55e"/>
    <text x="766" y="361" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">AUTHENTIC</text>
    <rect x="828" y="344" width="104" height="26" rx="13" fill="rgba(239,68,68,.15)" stroke="#ef4444"/>
    <text x="880" y="361" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">TAMPERED</text>
    <rect x="744" y="376" width="160" height="24" rx="12" fill="rgba(245,158,11,.15)" stroke="#f59e0b"/>
    <text x="824" y="392" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">AI-GENERATED  + heatmap</text>
  </g>
</svg>
